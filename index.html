<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPA | Загрузка...</title>
    <style>
        body { background: #000; color: #00c2b3; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .btn { background: #00c2b3; color: #000; padding: 20px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div id="loader">
        <h2>ПОДКЛЮЧЕНИЕ К SAPA...</h2>
        <p>Пожалуйста, подождите или нажмите кнопку ниже</p>
        <a href="https://script.google.com/macros/s/AKfycby58hfcDTim5JM-yWSEvYJ1x8xG23Ozkcdv3HP7-GnU3NsLuh1o771yb-Kv0UB_4bBc/exec" id="manual-btn" class="btn">ОТКРЫТЬ ФОРМУ</a>
    </div>

    <script>
        var targetUrl = "https://script.google.com/macros/s/AKfycby58hfcDTim5JM-yWSEvYJ1x8xG23Ozkcdv3HP7-GnU3NsLuh1o771yb-Kv0UB_4bBc/exec";
        
        // 1. Попытка автоматического редиректа
        window.location.href = targetUrl;

        // 2. Хак для Android (Intent) - выбивает из Инсты в Chrome
        if (/Android/i.test(navigator.userAgent) && /Instagram/i.test(navigator.userAgent)) {
            window.location.href = "intent://" + targetUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
        }

        // 3. Если через 2 секунды ничего не произошло (iOS), показываем кнопку
        setTimeout(function() {
            document.getElementById('manual-btn').style.display = 'inline-block';
        }, 2000);
    </script>
</body>
</html>
